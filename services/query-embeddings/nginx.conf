server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name embeddings.129-150-32-215.sslip.io;

    ssl_certificate /etc/letsencrypt/live/embeddings.129-150-32-215.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/embeddings.129-150-32-215.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/embeddings {
        limit_except POST { deny all; }
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8001/v1/embeddings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name embeddings.129-150-32-215.sslip.io;
    return 301 https://$host$request_uri;
}
